name: hafa_mobile
description: HAFA - Heritage Artisan Fair-Trade Authenticator (aplikasi mobile Flutter).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2              # state management (ganti React Context)
  go_router: ^14.6.2            # navigasi (ganti react-router)
  http: ^1.2.2                  # panggilan API (ganti axios)
  shared_preferences: ^2.3.3    # simpan sesi pengguna/peranan (ganti localStorage)
  google_fonts: ^6.2.1          # Playfair Display + Inter
  cached_network_image: ^3.4.1  # cache gambar produk
  mobile_scanner: ^5.2.3        # imbas QR guna kamera (sebenar)
  nfc_manager: ^3.5.0           # baca/tulis tag NFC (sebenar)
  qr_flutter: ^4.1.0            # jana QR pada Heritage Passport
  flutter_map: ^7.0.2           # peta OpenStreetMap (ganti leaflet)
  latlong2: ^0.9.1
  fl_chart: ^0.69.0             # carta dashboard (ganti recharts)
  image_picker: ^1.1.2          # pilih/ambil gambar produk
  pdf: ^3.11.1                  # jana sijil PDF
  printing: ^5.13.4             # papar/kongsi/simpan PDF

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon-512.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F4C3A"
  adaptive_icon_foreground: "assets/images/icon-512.png"
